name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The rot detector's purpose is catching link ROT, and rot is not an event in
  # this repository: on push/PR alone it only catches a link the author just
  # broke, never a project repo renamed or made private months after the README
  # last changed. The daily run is what makes `link-rot` a rot detector.
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  # Only cancel superseded PR runs. `verify` is a REQUIRED status check on
  # `main` with enforce_admins: true, so a cancelled run on `main` leaves that
  # commit with no completed result — and a burst of pushes would cancel the
  # scheduled rot run too, which is the one nothing else replaces.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===========================================================================
  # THE MERGE GATE. Required on `main` with enforce_admins: true.
  # ===========================================================================
  #
  # This job must be able to fail for a reason that is THIS REPOSITORY'S FAULT,
  # and must not be able to fail for anyone else's. That is the whole split.
  #
  # It used to probe arbitrary third-party hosts with `fail: true` while being
  # the sole required context on a branch with `enforce_admins: true` and no
  # bypass actor. So a third-party 503 — or the very signal the check exists to
  # find, a project repo gone private answering 403 — made `main` unmergeable
  # with no override. A successful rot detection and a wedged branch were the
  # same event.
  #
  # Resolved by scope, not by weakening the gate: a required gate should be
  # deterministic and locally decidable, and a detector should report without
  # holding the gate hostage. The inverse — dropping the requirement so nothing
  # gates `main` — would leave the repo a hiring reviewer lands on first with
  # no gate at all.
  #
  # WHAT THIS GATE GUARANTEES, STATED AS NARROWLY AS IT IS TRUE
  #
  # No LINK TARGET can redden it: it resolves relative paths and in-file
  # anchors on the checkout and contacts nothing. An earlier revision of this
  # comment claimed the gate "cannot be reddened by anyone else's outage" full
  # stop, which was false — see below.
  #
  # THE GATE'S OWN SUPPLY CHAIN WAS THE REMAINING WEDGE
  #
  # `lycheeverse/lychee-action` fetches the lychee binary from a GitHub release
  # asset on every run (`curl -sfLO` against
  # `github.com/lycheeverse/lychee/releases/download/...`, read from the
  # action's own action.yml at the pinned SHA). `curl -sf` has no retry and the
  # step has no fallback, so a lycheeverse release-asset outage or a release-CDN
  # incident reddened the sole required context — the same deadlock, relocated
  # from the link targets to the toolchain. Resolving the mutable tags `@v5` and
  # `@v2` on every run added a second path: a breaking retag lands here with no
  # commit in this repository.
  #
  # So the gate's assertion is now a Node script over `git ls-files`, using the
  # runtime already on the runner. This repository's markdown holds ONE
  # relative link; asserting it resolves does not justify fetching a 7MB binary
  # over the network at gate time. After `actions/checkout` this job makes NO
  # network request, which is a property rather than a hope.
  #
  # The residual third-party dependency is `actions/checkout` itself, pinned
  # below to a full commit SHA. That is unavoidable — the gate must have the
  # code — and a SHA cannot be retagged under us.
  #
  # The job id stays `verify` ON PURPOSE: it is the literal required context
  # name in `main`'s protection. Renaming it, or adding a job-level `name:`,
  # renames the context and wedges `main` on a check nothing reports. The
  # context-drift step in `link-rot` below asserts that pairing against the
  # live API under this workflow's own GITHUB_TOKEN, and fails loudly if it
  # cannot perform the read — see that step for what changed and why the
  # previous revision's version of this sentence was not true.
  verify:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA, not `@v5`. A tag is a mutable pointer: the
      # tag `v5` resolved to this commit when pinned, and the publisher can move
      # it to any other commit at any time, which would change what the sole
      # required check on a protected branch executes with no commit here.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1

      # No `uses:`, no download, no network. The script resolves every relative
      # link and in-file anchor in TRACKED markdown (`git ls-files`, so an
      # untracked `node_modules` cannot enter the input set by construction)
      # and fails closed if it cannot determine its own input set.
      #
      # Mutation-tested before shipping: a broken relative link, a `#anchor`
      # with no matching heading, a link escaping the repo root, a broken
      # root-relative link, a broken reference definition, an empty input set,
      # and an unreadable input set each fail with a named message. The
      # empty-input case matters because it is how this gate could go green
      # having asserted nothing — it is an explicit failure rather than a pass.
      - name: Check local links and relative paths resolve
        run: node .github/scripts/check-local-links.mjs

  # ===========================================================================
  # THE ROT DETECTOR. Deliberately NOT a required status check.
  # ===========================================================================
  #
  # This is the half that needs the network, so it is the half that must not
  # gate merging. A red run here blocks nothing; the filed issue is the
  # notification path, exactly as agentlens' `protection-drift` job does it.
  #
  # Skipped on pull_request: a PR cannot make someone else's repository
  # private, so there is nothing new for it to observe, and running it per push
  # spends third-party requests for a result that cannot differ from the
  # scheduled one.
  link-rot:
    name: Link rot (not required)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the failure issue below. Without it a red scheduled run surfaces
      # only as mail to whoever last touched the cron — nobody, for a workflow
      # that runs unattended.
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      # The required context on `main` is the bare job id `verify`, with no
      # job-level `name:`. Adding one — a one-line cosmetic edit — renames the
      # context and wedges `main` on a check nothing will ever report.
      #
      # This asserts the pairing directly: the job ids this workflow declares,
      # read from a REAL YAML PARSE of the file, against the contexts live
      # protection actually requires. No line scanning — the sibling repo's
      # guard was bypassed six times by exactly that, most recently by a quoted
      # key, and a merge key (`<<: *anchor`) is invisible to any line scanner by
      # construction.
      #
      # THE LIVE HALF USED TO BE A NO-OP. It read
      # `/branches/main/protection/required_status_checks`, which needs
      # `administration` read that GITHUB_TOKEN cannot be granted, so every
      # real run printed an HTTP 403 warning and exited 0 — including, when
      # tested, on a genuinely wedged branch and on protection deleted
      # outright. Three different conditions collapsed into one harmless path.
      #
      # It now reads `/repos/{owner}/{repo}/branches/main`, which embeds
      # `protection.required_status_checks.contexts` and needs only repository
      # read (verified unauthenticated against three repos in three protection
      # states; the old endpoint answered 401 for all three). Rulesets are
      # consulted too, since they report nothing under `protection`. A read
      # that genuinely fails now exits NON-ZERO as "could not verify", because
      # an unverifiable claim is not a satisfied one — the sole exception being
      # rate limiting, which is distinguished from a real permissions refusal
      # by `x-ratelimit-remaining` and warns instead, since a shared runner NAT
      # pool can exhaust the 60/hr-per-IP budget with no call of our own.
      #
      # It lives in THIS job and not in `verify` on purpose: it calls
      # api.github.com, so it must never be able to red the merge gate.
      - name: Assert the required context still matches a declared job id
        env:
          # The script treats this as OPTIONAL — it runs locally with no
          # credential. Supplied here to spend the authenticated 5000/hr quota
          # rather than the 60/hr budget shared across GitHub-hosted runners.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Installed and RUN outside the workspace. `npm install` in the
          # checkout creates ./node_modules, and the rot detector below globs
          # './**/*.md' — which then picks up dependency READMEs and fails the
          # job on THEIR links. The first real run of this workflow did exactly
          # that: it reported a missing `node_modules/yaml/docs/CONTRIBUTING.md`
          # and a 403 from npmjs.com, neither of which is this repository's
          # content nor this repository's problem.
          #
          # The script is COPIED next to the installed module because Node's
          # ESM resolver walks up from the script's own location, not the cwd —
          # NODE_PATH has no effect on ESM imports (verified). The workflow path
          # is passed explicitly since the script is no longer inside the repo.
          deps="$RUNNER_TEMP/drift-deps"
          mkdir -p "$deps"
          npm install --prefix "$deps" --no-save --ignore-scripts yaml@^2
          cp .github/scripts/check-context-drift.mjs "$deps/"
          VERIFY_WORKFLOW_PATH="$PWD/.github/workflows/verify.yml" \
            node "$deps/check-context-drift.mjs"

      # The network half. This is where outbound links are actually probed.
      #
      # Input is `.` rather than './**/*.md'. lychee honours `.gitignore` for a
      # DIRECTORY input and ignores it for an explicit GLOB — measured on a
      # checkout with node_modules present: `.` → 14 links, exit 0; the glob →
      # 59 links, exit 2 on a dependency's own broken link. The committed
      # .gitignore's claim to be a safety net against a bare `npm install` is
      # therefore only true under `.`, and this is the invocation that makes it
      # true rather than a comment asserting it.
      #
      # --accept        the real default set plus 429, because rate limiting is
      #                 the shared runner IP's fault and not rot. 403 stays
      #                 REJECTED: that is how a repo gone private answers,
      #                 which is the rot being looked for. The default accepted
      #                 set is `100..=103` and `200..=299`, read from
      #                 lychee-lib/src/types/status_code_selector.rs where
      #                 `default_accepted()` returns exactly
      #                 `StatusRange::new(100, 103)` and
      #                 `StatusRange::new(200, 299)` — and `--accept` REPLACES
      #                 that set rather than extending it, so both ranges are
      #                 restated here. An earlier value of `200..=299,429`
      #                 silently dropped `100..=103`.
      #
      #                 This flag belongs in THIS job only. It was also set on
      #                 the gate, where `--offline` means there are no status
      #                 codes to accept: identical results with the flag, with
      #                 no flag, and with an absurd `500..=599`. Nineteen lines
      #                 justified it there, which taught a reader that the
      #                 gate's accepted-status set was load-bearing.
      # --max-retries   still worth having so a one-off blip does not file an
      #                 issue, but no longer load-bearing: this job failing now
      #                 costs an issue, not an unmergeable branch.
      # --exclude       LinkedIn answers non-browser clients with HTTP 999 by
      #                 design, so it can never pass; excluding the host beats
      #                 globally accepting 999 and hiding a real one.
      - name: Check outbound links resolve
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.6.1
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 100..=103,200..=299,429
            --max-retries 3
            --retry-wait-time 5
            --exclude 'linkedin\.com'
            '.'
          fail: true
        env:
          # Belt and braces, not the mechanism: lychee-action's action.yml
          # declares `token:` with `default: ${{ github.token }}` and its
          # entrypoint.sh exports it as GITHUB_TOKEN, so the action already
          # authenticates github.com requests without this line (confirmed in a
          # real run's step env, including in a job that set no token of its
          # own). This makes it explicit. The protection it buys is against
          # api.github.com's 60 req/hr per source IP on a NAT pool shared with
          # the whole platform — relevant to github.com repo links generally,
          # though this repository's markdown currently contains no
          # api.github.com URL.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One deduplicated issue is the notification path. Deduped by LABEL plus
      # an exact title match, not by a word search: `--search "$TITLE in:title"`
      # restricts the field but is not a phrase match, and `.[0]` of a
      # relevance-ordered list can resolve to an unrelated issue that the
      # success path then closes.
      #
      # `gh issue list --jq` is gh's built-in jq and does NOT accept `--arg`
      # (it errors with "unknown arguments"), so the title is passed through the
      # environment and read as `env.TITLE`.
      - if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Outbound links in this repo have rotted"
          LABEL: link-rot
        run: |
          body=$'The scheduled `link-rot` check failed: at least one outbound link in this repository no longer resolves, or the required-context drift assertion failed.\n\nThis does NOT block merging — `verify` is the required gate and it runs offline.\n\nRun: '"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --label "$LABEL" --state all \
            --json number,state,title \
            --jq 'map(select(.title == env.TITLE)) | .[0] | select(.) | "\(.number) \(.state)"')
          if [ -n "$existing" ]; then
            num=${existing%% *}
            state=${existing##* }
            # `if`, not `[ … ] && cmd`: under `bash -e` an `a && b` whose `a` is
            # false evaluates to exit 1 and would fail the step if it were last.
            if [ "$state" = "CLOSED" ]; then
              gh issue reopen "$num"
            fi
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$body"
          fi

      # The close path. VERIFICATION STATUS, stated precisely because the
      # previous claim about it was wrong:
      #
      # PR #7's body said merging it would exercise this path by closing #6. It
      # did not. #6's `closed` event is `actor=edgeorgie` at 10:48:43Z, the same
      # second as the `referenced` event for merge commit 59237eb — GitHub's
      # own merge-time issue closing, driven by the merge. This step started at
      # 10:48:55Z, twelve seconds later, found nothing open, and did nothing.
      # The proof it was not the closer is that #6 has zero comments, while this
      # step posts one BEFORE closing. So it had only ever passed vacuously.
      #
      # It is now exercised for real, in both directions, against a
      # purpose-filed issue (#10) carrying this exact title and label:
      #
      #   run 38251476962  no matching open issue  → "nothing to close", exit 0
      #   run 38251924817  #10 open                → commented, then closed
      #
      # and issue #10's own events read `closed … actor=github-actions[bot]`
      # with one comment, where #6 read `actor=edgeorgie` with zero. The `else`
      # branch exists so the negative case is visible in the log rather than
      # being indistinguishable from a run that closed something — which is
      # precisely how the #6 claim went unchallenged.
      - if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "Outbound links in this repo have rotted"
          LABEL: link-rot
        run: |
          num=$(gh issue list --label "$LABEL" --state all \
            --json number,state,title \
            --jq 'map(select(.title == env.TITLE and .state == "OPEN")) | .[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Resolved: the links resolve and the required context still matches a declared job id. Closing."
            gh issue close "$num"
          else
            echo "No open \`$LABEL\` issue titled \"$TITLE\" — nothing to close."
          fi
