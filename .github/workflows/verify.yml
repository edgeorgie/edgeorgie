name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The gate's purpose is catching link ROT, and rot is not an event in this
  # repository: on push/PR alone it only catches a link the author just broke,
  # never a project repo renamed or made private months after the README last
  # changed. The daily run is what makes this a rot detector.
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  # Only cancel superseded PR runs. `verify` is a REQUIRED status check on
  # `main` with enforce_admins: true, so a cancelled run on `main` leaves that
  # commit with no completed result — and a burst of pushes would cancel the
  # scheduled rot run too, which is the one nothing else replaces.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # This repo's payload is prose plus outbound links to the projects it
      # advertises, so link resolution is the only thing worth gating on.
      #
      #   --accept        REPLACES lychee's default accepted set rather than
      #                   extending it (default: 100..=103 and 200..=299, see
      #                   lychee-lib/src/types/status_code_selector.rs,
      #                   `default_accepted`), so the earlier `200,206,429`
      #                   narrowed success to three exact codes and failed a
      #                   healthy 204. 429 is added because rate limiting is
      #                   the shared runner IP's fault; 403 stays rejected
      #                   because that is how a repo gone private answers,
      #                   which is the rot being looked for.
      #   --max-retries   `verify` is required on a branch with
      #                   enforce_admins: true, so an unretried third-party 503
      #                   would block merging with no override.
      #   --exclude       LinkedIn answers non-browser clients with HTTP 999 by
      #                   design, so it can never pass; excluding the host beats
      #                   globally accepting 999 and hiding a real one.
      - name: Check markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200..=299,429
            --max-retries 3
            --retry-wait-time 5
            --exclude 'linkedin\.com'
            './**/*.md'
          fail: true
        env:
          # For api.github.com links, which otherwise get 60 req/hr per source
          # IP on a NAT pool shared with the whole platform.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
